<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      var msg = "ERROR: " + message + " at " + source + ":" + lineno + ":" + colno;
      console.error(msg);
      fetch("/error-log?msg=" + encodeURIComponent(msg));
    };
    window.addEventListener('unhandledrejection', function(event) {
      var msg = "PROMISE REJECTION: " + event.reason;
      console.error(msg);
      fetch("/error-log?msg=" + encodeURIComponent(msg));
    });
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>🌙 Miuu's Magical Universe 🌙</title>
  
  <!-- Styling -->
  <link rel="stylesheet" href="./style.css?v=2.6.2">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

  <!-- GSAP Core -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- React root mounting container -->
  <div id="root"></div>

  <!-- React App logic loader as ES Module -->
  <script type="module" src="./app.js?v=2.6.4"></script>

</body>
</html>
